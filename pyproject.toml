[project]
name = "omop-alchemy"
dynamic = ["version"]
description = "SQLAlchemy-based models, validation, and utilities for the OHDSI OMOP Common Data Model"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Georgie Kennedy", email = "georgie.kennedy@unsw.edu.au" }
]
license = { text = "Apache-2.0" }

keywords = [
  "OMOP",
  "OHDSI",
  "clinical-data",
  "health-informatics",
  "sqlalchemy",
  "ETL",
  "real-world-evidence"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "sqlalchemy>=2.0.45",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "oa-configurator>=1.0.0,<2.0.0",
  "typer>=0.12",
  "rich>=13.0",
  "orm-loader>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2",
]

semantics = [
  "omop-semantics>=0.6.0",
]

dev = [
  "oa-configurator[dev,postgres]>=1.0.0,<2.0.0",
  "ipython>=8.0",
  "requests>=2.33.0",
  "pytest>=9.0.3",
  "pytest-cov>=4.0",
  "ty==0.0.61",
  "ruff>=0.4",
  "import-linter>=2.0",
  "mkdocs-material>=9.7.7",
  "mkdocstrings-python>=2.0.1",
  "mkdocs>=1.6.1",
  "mkdocs-mermaid2-plugin"
]


[project.urls]
Homepage = "https://australiancancerdatanetwork.github.io/OMOP_Alchemy/"
Repository = "https://github.com/AustralianCancerDataNetwork/OMOP_Alchemy"
Issues = "https://github.com/AustralianCancerDataNetwork/OMOP_Alchemy/issues"

[project.scripts]
omop-alchemy = "omop_alchemy.maintenance.cli:main"

[project.entry-points."omop.config"]
omop_alchemy = "omop_alchemy.config:OmopAlchemyConfig"


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["omop_alchemy"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
addopts = "-m 'not db_dialect'"

