name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  label-gate:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/label-gate.yml@main
  lint-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - run: uv run lint-imports
  build-test-sqlite:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test.yml@main
    with:
      ty-src: omop_alchemy
  build-test-postgres:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test-postgres.yml@main
    with:
      ty-src: omop_alchemy
      postgres-db: test_db
      setup-commands: |
        uv run omop-config connections add pg_test \
          --dialect postgresql+psycopg \
          --host localhost \
          --port 5432 \
          --user test \
          --password test \
          --database-name test_db \
          --test-only true
        uv run omop-config databases add test_cdm_db \
          --kind cdm \
          --connection pg_test \
          --schema-name public
        uv run omop-config configure omop_alchemy \
          --test-cdm-db test_cdm_db
